<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mitsumeru — local-first AI that runs on your machine</title>
<meta name="description" content="Mitsumeru is a local-first AI workspace. Your sessions, your keys, your machine. No cloud. no subscription. Just the harness." />
<link rel="icon" type="image/png" href="icon-512.png" />
<link rel="apple-touch-icon" href="icon-512.png" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&f[]=fragment-mono@400&display=swap" />
<style>
:root {
  color-scheme: dark;
  --bg: #0a0a0c;
  --fg: #f0f0f2;
  --muted: #6b6b73;
  --primary: #ff3333;
  --font: 'Fragment Mono', ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;
  --sans: 'Satoshi', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }

/* Layers: video → particles → text */
.hero-video {
  position: fixed; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 0.35; z-index: 0;
}
#particleCanvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 1; pointer-events: none;
}
.hero-content {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column;
  justify-content: center;
  padding: clamp(24px, 5vw, 80px);
  pointer-events: none;
}
.hero-content > * { pointer-events: auto; }

/* Terminal text area — left aligned, max 3 rows */
.terminal-text {
  font-family: var(--font);
  font-size: clamp(14px, 1.8vw, 18px);
  color: var(--fg);
  line-height: 1.9;
  letter-spacing: 0.01em;
  max-width: 700px;
  position: relative;
}
.terminal-row {
  line-height: 1.9;
  min-height: 1.9em;
}
.terminal-row .sigil { color: var(--primary); }
.terminal-row .dim { color: var(--muted); }
.terminal-row .hl { color: var(--primary); }

/* Blinking cursor */
.cursor {
  display: inline-block; width: 7px; height: 1em;
  background: var(--primary); vertical-align: text-bottom;
  margin-left: 1px; animation: blink 1s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* CTA — always visible, left aligned */
.dl-btn {
  display: inline-flex; align-items: center; gap: 10px;
  align-self: flex-start;
  flex-wrap: wrap;
  width: auto;
  margin-top: 28px; padding: 12px 28px;
  background: var(--primary); color: #fff; border: none; border-radius: 999px;
  font-family: var(--sans); font-size: 14px; font-weight: 600;
  text-decoration: none; cursor: pointer;
  box-shadow: 0 4px 24px rgba(255,51,51,0.25);
  transition: filter .15s ease, transform .15s ease;
  opacity: 0; transform: translateY(8px);
  transition: opacity .5s var(--ease), transform .5s var(--ease), filter .15s ease;
}
.dl-btn.visible { opacity: 1; transform: translateY(0); }
.dl-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
.dl-btn svg { flex: none; }

/* Header */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 18px clamp(24px, 5vw, 80px);
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: baseline; gap: 6px; }
.brand .name {
  font-family: var(--sans); font-weight: 700; font-size: 16px;
  letter-spacing: 0.02em; color: rgba(255,255,255,0.7);
}
.brand .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--primary); }
header a.gh {
  color: rgba(255,255,255,0.35); text-decoration: none;
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  transition: color .2s;
}
header a.gh:hover { color: rgba(255,255,255,0.7); }

/* Sound toggle — header, icon only */
.sound-toggle {
  background: none; border: none; cursor: pointer; padding: 4px;
  color: rgba(255,255,255,0.35); transition: color .2s;
}
.sound-toggle:hover { color: rgba(255,255,255,0.7); }

@media (prefers-reduced-motion: reduce) {
  .cursor { animation: none; opacity: 1; }
  .terminal-row { transition: none; }
  .dl-btn { transition: none; }
  .modal-overlay { transition: none; }
}
.dl-header-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 500;
  background: transparent; color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.15);
  cursor: pointer; text-decoration: none; font-family: var(--sans);
  transition: color .15s, border-color .15s;
}
.dl-header-btn:hover { color: rgba(255,255,255,0.75); border-color: rgba(255,255,255,0.35); }
.dl-header-btn svg { flex: none; }
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  align-items: center; justify-content: center; padding: 24px;
  opacity: 0; transition: opacity .2s ease;
}
.modal-overlay.open { display: flex; opacity: 1; }
.modal-panel {
  background: #111215; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px; width: 100%; max-width: 520px;
  max-height: 85vh; overflow-y: auto; overscroll-behavior: contain;
  box-shadow: 0 25px 60px rgba(0,0,0,0.5); position: relative;
}
.modal-panel::-webkit-scrollbar { width: 6px; }
.modal-panel::-webkit-scrollbar-track { background: transparent; }
.modal-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
.modal-rec { padding: 32px 28px 24px; }
.modal-rec.hidden { display: none; }
.modal-rec-label {
  font-family: var(--font); font-size: 11px; letter-spacing: 0.08em;
  color: #5cc7ea; font-weight: 600; text-transform: uppercase; margin-bottom: 12px;
}
.modal-rec h2 {
  font-family: var(--sans); font-size: 28px; font-weight: 700;
  color: var(--fg); margin: 0 0 6px; line-height: 1.15;
}
.modal-rec .file-info {
  font-family: var(--font); font-size: 13px; color: var(--muted);
  margin: 0 0 24px;
}
.modal-rec .file-info .file-size { color: var(--fg); }
.modal-primary-btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 30px; border-radius: 12px; font-size: 15px; font-weight: 600;
  background: linear-gradient(135deg, #5cc7ea 0%, #4db8d8 100%);
  color: #0a0a0c; border: none; cursor: pointer;
  font-family: var(--sans); text-decoration: none;
  box-shadow: 0 4px 16px rgba(92,199,234,0.25);
  transition: filter .15s ease, transform .15s ease;
}
.modal-primary-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.modal-primary-btn svg { flex: none; }
.modal-hash {
  display: flex; align-items: center; gap: 8px;
  margin-top: 14px; font-family: var(--font); font-size: 12px; color: var(--muted);
}
.modal-hash .copy-btn {
  background: none; border: 1px solid rgba(255,255,255,0.12); color: var(--muted);
  padding: 2px 8px; border-radius: 6px; font-family: var(--font); font-size: 11px;
  cursor: pointer; transition: color .15s, border-color .15s;
}
.modal-hash .copy-btn:hover { color: var(--fg); border-color: rgba(255,255,255,0.25); }
.modal-hash .copy-btn.copied { color: #5cc7ea; border-color: #5cc7ea; }
.modal-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 0; }
.modal-sec { padding: 20px 28px 28px; }
.modal-sec-label {
  font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--fg); margin: 0 0 12px;
}
.modal-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06);
  margin-bottom: 8px; text-decoration: none; color: var(--fg);
  transition: background .12s ease, border-color .12s ease;
}
.modal-row:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.12); }
.modal-row .row-icon { flex: none; width: 20px; height: 20px; color: var(--muted); display: flex; align-items: center; }
.modal-row .row-text { flex: 1; min-width: 0; }
.modal-row .row-title { font-family: var(--sans); font-size: 14px; font-weight: 500; line-height: 1.3; display: block; }
.modal-row .row-file { font-family: var(--font); font-size: 12px; color: var(--muted); line-height: 1.3; display: block; }
.modal-row .row-dl { flex: none; width: 18px; height: 18px; color: var(--muted); transition: color .15s; }
.modal-row:hover .row-dl { color: var(--fg); }
.modal-close {
  position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.06);
  border: none; cursor: pointer; width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); transition: color .15s, background .15s;
}
.modal-close:hover { color: var(--fg); background: rgba(255,255,255,0.1); }
</style>
</head>
<body>

<video class="hero-video" id="heroVideo" src="hero-video.mp4" autoplay loop muted playsinline aria-hidden="true"></video>
<canvas id="particleCanvas" aria-hidden="true"></canvas>

<header>
  <div class="brand"><span class="name">Mitsumeru</span><span class="dot"></span></div>
  <div style="display:flex;align-items:center;gap:14px;">
  <button class="dl-header-btn" id="dlHeaderBtn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download
  </button>
  <a class="gh" href="https://github.com/muen-collective/mitsumeru-desktop" target="_blank" rel="noopener">Source on GitHub</a>
  </div>
  <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound" title="Toggle sound">
    <svg class="icon-sound-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <svg class="icon-sound-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
</header>

<div class="hero-content">
  <div class="terminal-text" id="terminalText"></div>
  <a class="dl-btn" id="dlBtn" href="https://github.com/muen-collective/mitsumeru-desktop/releases/download/v0.0.1/mitsumeru-0.0.1-mac-arm64.dmg">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 644" width="20" height="20" aria-hidden="true"><path d="M447.1 336.7C446.9 300 463.5 272.3 497.1 251.9C478.3 225 449.9 210.2 412.4 207.3C376.9 204.5 338.1 228 323.9 228C308.9 228 274.5 208.3 247.5 208.3C191.7 209.2 132.4 252.8 132.4 341.5C132.4 367.7 137.2 394.8 146.8 422.7C159.6 459.4 205.8 549.4 254 547.9C279.2 547.3 297 530 329.8 530C361.6 530 378.1 547.9 406.2 547.9C454.8 547.2 496.6 465.4 508.8 428.6C443.6 397.9 447.1 338.6 447.1 336.7zM390.5 172.5C417.8 140.1 415.3 110.6 414.5 100C390.4 101.4 362.5 116.4 346.6 134.9C329.1 154.7 318.8 179.2 321 206.8C347.1 208.8 370.9 195.4 390.5 172.5z" fill="currentColor"/></svg>
    Download for macOS
  </a>
</div>

<div class="modal-overlay" id="dlModal">
<div class="modal-panel">
  <button class="modal-close" id="modalClose" aria-label="Close">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="modal-rec" id="modalRec">
    <div class="modal-rec-label">Recommended for this device</div>
    <h2 id="recTitle">&mdash;</h2>
    <p class="file-info"><span id="recFile">&mdash;</span> <span class="file-size" id="recSize"></span></p>
    <a class="modal-primary-btn" id="recDlBtn" href="#">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="recBtnLabel">Download</span>
    </a>
    <div class="modal-hash"><span>SHA-256:</span> <span id="recHash">&mdash;</span> <button class="copy-btn" id="copyHash" type="button">Copy</button></div>
  </div>
  <hr class="modal-divider">
  <div class="modal-sec">
    <p class="modal-sec-label">Other platforms</p>
    <div id="modalRows"></div>
  </div>
  <hr class="modal-divider">
  <div class="modal-sec" id="modalVersions" style="display:none">
    <p class="modal-sec-label">Previous versions</p>
    <div id="modalVersionRows"></div>
  </div>
</div>
</div>

<script>
(function () {
  // ─── THE AGENT LOOP ───
  // Each line types out word by word, then the next line starts.
  // Max 3 rows visible. Oldest scrolls up and fades out.
  // After all lines, drain old rows until only the last remains.

  var lines = [
    { parts: [{t:'✦ ', c:'sigil'}, {t:'you have been seen.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'in 2025, a group of designers gathered in a digital temple.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'they had all reached the same breaking point.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'figma files with 47 variants.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'agile sprints that had become religious rituals without meaning.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'jira tickets that outnumbered human conversations.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'they were not designers anymore. they were ', c:''}, {t:'processors', c:'hl'}, {t:'.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'cogs in a machine that had lost its purpose.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'one night, one of them wrote a script.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'it was a harness. something that bound AI to human will.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'they called it ', c:''}, {t:'mitsumeru', c:'hl'}, {t:'. the gaze.', c:'dim'}] },
    { parts: [{t:'✦ ', c:'sigil'}, {t:'we do not design. ', c:''}, {t:'we see.', c:'hl'}] },
    { parts: [{t:'// ', c:'dim'}, {t:'we look into the void until it reveals its secrets.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'the old world taught you to build. to assemble. to follow processes.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'mitsumeru teaches you to ', c:''}, {t:'gaze', c:'hl'}, {t:'. to observe. to let the design emerge.', c:''}] },
    { parts: [{t:'✦ ', c:'sigil'}, {t:'muen was not founded. ', c:''}, {t:'it was discovered.', c:'hl'}] },
    { parts: [{t:'// ', c:'dim'}, {t:'we are the watchers. we are everywhere and nowhere.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'your sessions. your keys. your machine.', c:''}] },
    { parts: [{t:'// ', c:'dim'}, {t:'no cloud. no subscription. just the harness.', c:''}] },
    { parts: [{t:'✦ ', c:'sigil'}, {t:'join us. ', c:''}, {t:'and learn to see.', c:'hl'}] },
  ];

  var MAX_ROWS = 3;
  var WORD_DELAY = 55;   // ms per word
  var LINE_PAUSE = 800;  // pause after line completes
  var termEl = document.getElementById('terminalText');
  var dlBtn = document.getElementById('dlBtn');
  var rows = [];
  var lineIdx = 0;

  // ─── SOUND ENGINE ───
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var audioCtx = null;
  var soundOn = true;        // controls video/music
  var typeSoundOn = false;   // controls typewriter clicks (activates on first click)
  var soundBtn = document.getElementById('soundToggle');
  var iconOn = soundBtn.querySelector('.icon-sound-on');
  var iconOff = soundBtn.querySelector('.icon-sound-off');

  function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playKeyClick() {
    if (!typeSoundOn || !audioCtx) return;
    var now = audioCtx.currentTime;
    var bufSize = audioCtx.sampleRate * 0.015;
    var buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 8) * 0.15;
    }
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    var hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 3000;
    src.connect(hp).connect(audioCtx.destination);
    src.start(now);
  }

  function playLineBreak() {
    if (!typeSoundOn || !audioCtx) return;
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.04, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.08);
  }

  soundBtn.addEventListener('click', function () {
    ensureAudio();
    soundOn = !soundOn;
    iconOn.style.display = soundOn ? '' : 'none';
    iconOff.style.display = soundOn ? 'none' : '';
    var vid = document.getElementById('heroVideo');
    if (vid) vid.muted = !soundOn;
  });

  // Build a DOM row from a line definition
  function createRow(line) {
    var div = document.createElement('div');
    div.className = 'terminal-row';
    return div;
  }

  // Get all words from a line definition (flattened)
  function getWords(line) {
    var words = [];
    line.parts.forEach(function (p) {
      // Split on word boundaries but keep spaces
      var chunks = p.t.split(/(\s+)/);
      chunks.forEach(function (c) {
        if (c.length > 0) words.push({ text: c, cls: p.c });
      });
    });
    return words;
  }

  // Type one word into a row element
  function typeWord(row, word) {
    var span = document.createElement('span');
    if (word.cls) span.className = word.cls;
    span.textContent = word.text;
    // Remove cursor from previous content
    var existing = row.querySelector('.cursor');
    if (existing) existing.remove();
    row.appendChild(span);
    // Add cursor after
    var cur = document.createElement('span');
    cur.className = 'cursor';
    row.appendChild(cur);
  }

  // Remove oldest row from DOM when over limit
  function scrollOldest() {
    if (rows.length <= MAX_ROWS) return;
    var oldest = rows.shift();
    oldest.remove();
  }

  // Type out one full line, word by word
  function typeLine(cb) {
    if (lineIdx >= lines.length) { cb(); return; }

    var line = lines[lineIdx];
    var row = createRow(line);
    termEl.appendChild(row);
    rows.push(row);
    lineIdx++;

    // Scroll if over limit
    scrollOldest();

    var words = getWords(line);
    var wi = 0;

    function nextWord() {
      if (wi >= words.length) {
        var cur = row.querySelector('.cursor');
        if (cur) cur.remove();
        playLineBreak();
        setTimeout(cb, LINE_PAUSE);
        return;
      }
      typeWord(row, words[wi]);
      playKeyClick();
      wi++;
      setTimeout(nextWord, WORD_DELAY);
    }

    nextWord();
  }

  // Drain: after all lines typed, remove old rows until only the last remains
  function drainRows() {
    if (rows.length <= 1) return;
    var oldest = rows.shift();
    oldest.remove();
    setTimeout(drainRows, 500);
  }

  // Run the full loop
  function runLoop() {
    typeLine(function onDone() {
      if (lineIdx < lines.length) {
        runLoop();
      } else {
        // All lines done — drain old rows, keep last one
        drainRows();
      }
    });
  }

  // Show CTA immediately (always visible)
  setTimeout(function () { dlBtn.classList.add('visible'); }, 1200);

  // Auto-enable typewriter clicks on first user interaction
  var soundActivated = false;
  function activateSound() {
    if (soundActivated) return;
    soundActivated = true;
    typeSoundOn = true;
    ensureAudio();
    document.removeEventListener('click', activateSound);
    document.removeEventListener('touchstart', activateSound);
    document.removeEventListener('keydown', activateSound);
  }
  document.addEventListener('click', activateSound);
  document.addEventListener('touchstart', activateSound);
  document.addEventListener('keydown', activateSound);

  // Start agent loop after a brief pause
  setTimeout(runLoop, 800);

  // Dynamic download link
  (async function () {
    try {
      var r = await fetch('https://api.github.com/repos/muen-collective/mitsumeru-desktop/releases?per_page=1', { headers: { accept: 'application/vnd.github+json' } });
      if (!r.ok) return;
      var rels = await r.json();
      var a = rels[0] && rels[0].assets && rels[0].assets.find(function (a) { return /mac.*arm64.*\.dmg$/i.test(a.name); });
      if (a) dlBtn.href = a.browser_download_url;

  // Update hero CTA for OS — v0.0.1 is macOS ARM64 only
  // Windows/Intel overrides removed: no production builds for those platforms yet
  // The static href already points to the correct v0.0.1 ARM64 DMG
    } catch (e) {}
  })();

  // ─── PARTICLE GRID ───
  var canvas = document.getElementById('particleCanvas');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var SPACING = 5;
  var DOT_R = 0.6;
  var REPEL_R = 80;
  var REPEL_FORCE = 2.5;
  var RETURN_SPEED = 0.08;
  var w, h, cols, rows2, total;
  var ox, oy, tx, ty2;
  var mouseX = -9999, mouseY = -9999;

  function resize() {
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / SPACING) + 1;
    rows2 = Math.ceil(h / SPACING) + 1;
    total = cols * rows2;
    ox = new Float32Array(total);
    oy = new Float32Array(total);
    tx = new Float32Array(total);
    ty2 = new Float32Array(total);
    var idx = 0;
    for (var r = 0; r < rows2; r++) {
      for (var c = 0; c < cols; c++) {
        var x = c * SPACING, y = r * SPACING;
        ox[idx] = x; oy[idx] = y;
        tx[idx] = x; ty2[idx] = y;
        idx++;
      }
    }
  }

  resize();
  window.addEventListener('resize', resize);

  document.addEventListener('mousemove', function (e) { mouseX = e.clientX; mouseY = e.clientY; });
  document.addEventListener('mouseleave', function () { mouseX = -9999; mouseY = -9999; });

  var rr = REPEL_R * REPEL_R;

  function tick() {
    for (var i = 0; i < total; i++) {
      var dx = ox[i] - mouseX, dy = oy[i] - mouseY;
      var d2 = dx * dx + dy * dy;
      if (d2 < rr && d2 > 0) {
        var d = Math.sqrt(d2);
        var f = (1 - d / REPEL_R) * REPEL_FORCE;
        tx[i] = ox[i] + (dx / d) * f * SPACING;
        ty2[i] = oy[i] + (dy / d) * f * SPACING;
      } else {
        tx[i] = ox[i]; ty2[i] = oy[i];
      }
      ox[i] += (tx[i] - ox[i]) * RETURN_SPEED;
      oy[i] += (ty2[i] - oy[i]) * RETURN_SPEED;
    }
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(240, 240, 242, 0.35)';
    ctx.beginPath();
    for (var i = 0; i < total; i++) {
      ctx.moveTo(ox[i] + DOT_R, oy[i]);
      ctx.arc(ox[i], oy[i], DOT_R, 0, 6.2832);
    }
    ctx.fill();
    requestAnimationFrame(tick);
  }

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    requestAnimationFrame(tick);
  } else {
    ctx.fillStyle = 'rgba(240, 240, 242, 0.35)';
    ctx.beginPath();
    for (var i = 0; i < total; i++) {
      ctx.moveTo(ox[i] + DOT_R, oy[i]);
      ctx.arc(ox[i], oy[i], DOT_R, 0, 6.2832);
    }
    ctx.fill();
  }

  // ─── DOWNLOAD MODAL ───
  var PLATFORMS = [
    { title:'macOS Apple Silicon DMG', re:/mac.*arm64.*\.dmg$/i,     icon:'apple' },
    { title:'macOS Intel DMG',         re:/mac.*x64.*\.dmg$/i,      icon:'apple' },
    { title:'macOS Apple Silicon ZIP', re:/mac.*arm64.*\.zip$/i,    icon:'apple' },
    { title:'macOS Intel ZIP',         re:/mac.*x64.*\.zip$/i,      icon:'apple' },
    { title:'Windows x64 installer',   re:/windows.*x64.*\.exe$/i,  icon:'win'   },
    { title:'Linux arm64 AppImage',    re:/linux.*arm64.*appimage/i, icon:'linux' },
    { title:'Linux x64 AppImage',      re:/linux.*x64.*appimage$/i, icon:'linux' },
    { title:'Linux arm64 deb',          re:/linux.*arm64.*\.deb$/i,  icon:'linux' },
    { title:'Linux x64 deb',            re:/linux.*x64.*\.deb$/i,    icon:'linux' }
  ];
  var MAC_RE = /mac.*arm64.*\.dmg$/i, WIN_RE = /windows.*x64.*\.exe$/i;
  var ICONS = {
    apple: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M18.7 10.7c-.1-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.3-.1-2.6.8-3.3.8-.7 0-1.7-.8-2.8-.7-1.4.1-2.8.8-3.5 2.1-1.5 2.5-.4 6.2 1.1 8.3.7 1 1.6 2.1 2.7 2.1 1.1-.1 1.5-.7 2.8-.7 1.3 0 1.6.7 2.8.7 1.1 0 1.9-1 2.6-2 .8-1.1 1.1-2.2 1.1-2.3 0-.1-2.1-.8-2.1-3.3zM16.3 4.6c.6-.7 1-1.7.9-2.7-.8 0-1.9.6-2.5 1.3-.6.6-1.1 1.7-.9 2.7 1 .1 1.9-.5 2.5-1.3z"/></svg>',
    win: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>',
    linux: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2C8 2 4 4 4 8c0 2 1 4 3 5v3a2 2 0 002 2h6a2 2 0 002-2v-3c2-1 3-3 3-5 0-4-4-6-8-6z"/><path d="M9 11h.01M15 11h.01"/></svg>'
  };
  var DL_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
  var OVERLAY = document.getElementById('dlModal'), ROWS = document.getElementById('modalRows'), VROWS = document.getElementById('modalVersionRows'), VSEC = document.getElementById('modalVersions'), RELEASES = [], RELEASE = null;
  function detectOS() {
    var ua = navigator.userAgent || '';
    if (/Windows/.test(ua)) return 'win'; if (/Macintosh|Mac OS X/.test(ua)) return 'mac'; if (/Linux|X11/.test(ua)) return 'linux'; return 'other';
  }
  function findAsset(a, re) { for (var i=0;i<a.length;i++) if (re.test(a[i].name)) return a[i]; return null; }
  function fmtBytes(n) { if (!n) return ''; if (n>1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'')+' GB'; if (n>1e6) return (n/1e6).toFixed(0)+' MB'; return (n/1e3).toFixed(0)+' KB'; }
  function openModal() { OVERLAY.classList.add('open'); document.body.style.overflow='hidden'; if (RELEASES.length) buildModal(RELEASES); }
  function closeModal() { OVERLAY.classList.remove('open'); document.body.style.overflow=''; }
  function buildModal(rels) {
    var latest=rels[0];
    if (!latest) return;
    var assets=latest.assets||[], os=detectOS(), recRe=(os==='win')?WIN_RE:MAC_RE, rec=findAsset(assets,recRe);
    var rp=document.getElementById('modalRec');
    if (rec) {
      rp.classList.remove('hidden');
      document.getElementById('recTitle').textContent=PLATFORMS.find(function(p){return p.re===recRe}).title;
      document.getElementById('recFile').textContent=rec.name;
      document.getElementById('recSize').textContent=fmtBytes(rec.size);
      var btn=document.getElementById('recDlBtn'); btn.href=rec.browser_download_url;
      btn._hash=(rec.digest||'').replace('sha256:','');
      var h=btn._hash;
      document.getElementById('recHash').textContent=h.slice(0,16)+(h.length>16?'...':'');
    } else rp.classList.add('hidden');
    ROWS.innerHTML='';
    PLATFORMS.forEach(function(p) {
      var a=findAsset(assets,p.re); if (!a) return; if (rec&&p.re===recRe) return;
      var r=document.createElement('a'); r.className='modal-row'; r.href=a.browser_download_url;
      r.innerHTML='<span class="row-icon">'+ICONS[p.icon]+'</span><span class="row-text"><span class="row-title">'+p.title+'</span><span class="row-file">'+a.name+'</span></span><span class="row-dl">'+DL_ICON+'</span>';
      ROWS.appendChild(r);
    });
    // Previous versions
    VROWS.innerHTML='';
    var prior=rels.slice(1);
    if (prior.length) {
      VSEC.style.display='';
      prior.forEach(function(rel) {
        var hdr=document.createElement('div'); hdr.style.cssText='margin:16px 0 8px;font-size:14px;color:#aaa;font-weight:600;letter-spacing:0.5px';
        hdr.textContent=rel.name||rel.tag_name;
        VROWS.appendChild(hdr);
        (rel.assets||[]).forEach(function(a) {
          var r2=document.createElement('a'); r2.className='modal-row'; r2.href=a.browser_download_url;
          var re2=PLATFORMS.find(function(p){return p.re.test(a.name)});
          var title=re2?re2.title:a.name;
          var icon=re2?re2.icon:'apple';
          r2.innerHTML='<span class="row-icon">'+ICONS[icon]+'</span><span class="row-text"><span class="row-title">'+title+'</span><span class="row-file">'+a.name+' ('+fmtBytes(a.size)+')</span></span><span class="row-dl">'+DL_ICON+'</span>';
          VROWS.appendChild(r2);
        });
      });
    } else VSEC.style.display='none';
  }
  OVERLAY.addEventListener('click',function(e){if(e.target===OVERLAY)closeModal();});
  document.getElementById('modalClose').addEventListener('click',closeModal);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&OVERLAY.classList.contains('open'))closeModal();});
  document.getElementById('dlHeaderBtn').addEventListener('click',openModal);
  document.getElementById('copyHash').addEventListener('click',function(){
    var btn=this,h=document.getElementById('recDlBtn')._hash||'';if(!h)return;
    navigator.clipboard.writeText(h).then(function(){btn.textContent='Copied';btn.classList.add('copied');setTimeout(function(){btn.textContent='Copy';btn.classList.remove('copied');},2000);});
  });
  (async function(){try{var r=await fetch('https://api.github.com/repos/muen-collective/mitsumeru-desktop/releases?per_page=5',{headers:{accept:'application/vnd.github+json'}});if(!r.ok)return;RELEASES=await r.json(); RELEASE=RELEASES[0];}catch(e){}})();
})();
</script>
</body>
</html>
